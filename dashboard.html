<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Rezepte | Lezzetify</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="library/css/bootstrap.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="library/css/all.min.css">
    <!-- Eigene Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- =========================================
         NAVIGATION (Angepasst an Startseite)
         ========================================= -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="Lezzetify Logo" width="30" height="30" class="me-2 rounded">
                Lezzetify
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#dashboardNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="dashboardNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Startseite</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-primary-custom" href="#">Meine Rezepte</a></li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logout-button">
                            <i class="fas fa-sign-out-alt me-1"></i>Abmelden
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- =========================================
         HAUPTBEREICH DASHBOARD
         ========================================= -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            
            <!-- Header-Bereich mit Begrüßung und Call-to-Action -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
                <div>
                    <span class="badge bg-warning text-dark mb-2">Dein Rezeptmanager</span>
                    <h2 class="fw-bold text-dark mb-0">Willkommen in deiner Küche, <span class="text-primary-custom" id="user-email">Chefkoch</span>! 👩‍🍳</h2>
                </div>
                <!-- Button öffnet das Modal -->
                <button class="btn btn-primary-custom btn-lg rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#createRecipeModal">
                    <i class="fas fa-plus me-2"></i>Neues Rezept
                </button>
            </div>

            <!-- Statistik & Übersicht (Neue Funktion) -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3 text-primary-custom">
                                <i class="fas fa-book-open fa-2x"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Meine Rezepte</h6>
                                <h3 class="fw-bold mb-0" id="recipe-count">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded-circle me-3 text-danger">
                                <i class="fas fa-heart fa-2x"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Favoriten</h6>
                                <h3 class="fw-bold mb-0">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 p-3 rounded-circle me-3 text-success">
                                <i class="fas fa-calendar-alt fa-2x"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Für diese Woche</h6>
                                <h3 class="fw-bold mb-0">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Such- und Filterleiste (Neue Funktion) -->
            <div class="card border-0 shadow-sm rounded-4 mb-5">
                <div class="card-body p-3">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" placeholder="Rezepte durchsuchen...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select">
                                <option selected>Kategorie...</option>
                                <option>Frühstück</option>
                                <option>Hauptgericht</option>
                                <option>Dessert</option>
                                <option>Vegan</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select">
                                <option selected>Sortieren nach...</option>
                                <option>Neueste zuerst</option>
                                <option>A-Z</option>
                                <option>Schnellste Zubereitung</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Benachrichtigung -->
            <div id="dashboard-message" class="alert d-none" role="status"></div>

            <!-- Rezept-Grid (Liste) -->
            <div id="recipe-list" class="row g-4">
                
                <!-- Leerer Zustand (Wird angezeigt, wenn noch keine Rezepte da sind) -->
                <div class="col-12 text-center py-5" id="empty-state">
                    <img src="images/logo.png" alt="Lezzetify" style="width: 80px; opacity: 0.5;" class="mb-3">
                    <h4 class="fw-bold text-dark">Deine Sammlung ist noch leer</h4>
                    <p class="text-muted">Klicke oben auf "Neues Rezept", um dein erstes Gericht hinzuzufügen.</p>
                </div>
                
                <!-- Hier werden später durch JavaScript die Rezept-Karten eingefügt (wie auf der Startseite) -->
                
            </div>
        </div>
    </main>

    <!-- =========================================
         MODAL: REZEPT ERSTELLEN
         ========================================= -->
    <div class="modal fade" id="createRecipeModal" tabindex="-1" aria-labelledby="createRecipeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                    <h4 class="modal-title fw-bold" id="createRecipeModalLabel"><i class="fas fa-utensils text-warning me-2"></i>Neues Rezept</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="recipe-form">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control rounded-3" id="recipe-title" name="title" placeholder="Rezeptname" maxlength="100" required>
                                    <label for="recipe-title">Rezeptname</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control rounded-3" id="recipe-prep-time" name="prepTime" placeholder="30" min="1" max="1440">
                                    <label for="recipe-prep-time"><i class="far fa-clock me-1"></i> Dauer (Min)</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control rounded-3" id="recipe-description" name="description" placeholder="Kurzbeschreibung" maxlength="240">
                                    <label for="recipe-description">Kurzbeschreibung (z.B. Herzhaftes Abendessen)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold" for="recipe-ingredients">Zutaten</label>
                                <textarea class="form-control rounded-3" id="recipe-ingredients" name="ingredients" rows="5" placeholder="100g Mehl&#10;2 Eier&#10;... (Eine Zutat pro Zeile)" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold" for="recipe-instructions">Zubereitung</label>
                                <textarea class="form-control rounded-3" id="recipe-instructions" name="instructions" rows="5" placeholder="1. Eier aufschlagen...&#10;2. Mit Mehl vermengen..."></textarea>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-light rounded-pill px-4 me-2" data-bs-dismiss="modal">Abbrechen</button>
                            <button class="btn btn-primary-custom rounded-pill px-4" id="save-recipe-button" type="submit">
                                <i class="fas fa-save me-2"></i>Speichern
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Eigene JS -->
    <script src="library/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
